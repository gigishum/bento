name: bento
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pyside2=5.15
  - qtpy>=2.4,<3
  - numpy=1.23.5
  - h5py=3.9
  - matplotlib-base=3.7
  - scikit-learn=1.3
  - scikit-video=1.1.11
  - sqlalchemy=1.4
  - sortedcontainers
  - cryptography
  - progressbar
  - xlrd=2.0
  - openpyxl
  - vispy=0.12
  - pytables
  - pynwb=2.5
  - pip
  - pip:
    # NOTE: colour-science/colour-demosaicing want numpy>=1.24, but
    # scikit-video needs numpy<1.24 (uses removed np.float/np.int aliases).
    # numpy=1.23.5 is enforced above. Install colour-science and
    # colour-demosaicing separately with --no-deps (see installation.md)
    # to avoid pip silently upgrading numpy.
    - ndx-pose==0.1.1
    - opencv-python-headless==4.8.1.78
    - qimage2ndarray
    - pymatreader
    - timecode